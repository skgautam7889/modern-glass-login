<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free responsive login and sign-up template with customizable color themes.">
  <title>Login • Modern Portal</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <header class="top-bar">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme" title="Light / Dark">
      <i class="fa-solid fa-moon"></i>
    </button>
    <button class="palette-toggle" id="paletteToggle" type="button" aria-label="Choose accent color"
      title="Choose color">
      <i class="fa-solid fa-palette"></i>
    </button>

    <div class="color-panel" id="colorPanel">
      <div class="fw-semibold mb-1">Accent Colors</div>
      <div class="small mb-3" style="color:var(--text-secondary)">Choose a color theme</div>
      <div class="d-flex flex-wrap gap-3" id="colorList"></div>
      <hr class="my-3 opacity-25">
      <div class="small fw-semibold mb-2">Theme Mode</div>
      <select class="form-select form-select-sm" id="themeMode">
        <option value="auto">Auto (System)</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>
  </header>

  <main class="login-wrapper">
    <div class="container-fluid px-0">
      <div class="row justify-content-center g-0">
        <div class="col-12">
          <div class="card">

            <div class="brand">
              <div class="logo-container">
                <i class="fa-solid fa-lock"></i>
              </div>
              <h1 class="brand-title" id="formHeading">Welcome back</h1>
              <p class="brand-subtitle" id="formSubheading">Sign in to manage your account and workspace</p>
            </div>

            <div class="tab-switch" role="tablist">
              <button type="button" class="tab-btn active" id="tabSignIn" role="tab" aria-selected="true">
                <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In
              </button>
              <button type="button" class="tab-btn" id="tabSignUp" role="tab" aria-selected="false">
                <i class="fa-solid fa-user-plus me-1"></i> Sign Up
              </button>
            </div>

            <form id="authForm" novalidate autocomplete="on">

              <div class="form-group" id="nameGroup" style="display:none;">
                <label class="form-label" for="userName">Full Name</label>
                <div class="input-wrapper">
                  <div class="input-icon"><i class="fa-regular fa-user"></i></div>
                  <input type="text" id="userName" class="form-input" placeholder="Alex Johnson" autocomplete="name">
                </div>
                <div class="field-error" id="nameError"><i class="fa-solid fa-circle-exclamation"></i><span></span>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="email">Email address</label>
                <div class="input-wrapper">
                  <div class="input-icon"><i class="fa-regular fa-envelope"></i></div>
                  <input type="email" id="email" class="form-input" placeholder="alex@example.com" autocomplete="email"
                    required>
                </div>
                <div class="field-error" id="emailError"><i class="fa-solid fa-circle-exclamation"></i><span></span>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-wrapper">
                  <div class="input-icon"><i class="fa-solid fa-lock"></i></div>
                  <input type="password" id="password" class="form-input" placeholder="••••••••"
                    autocomplete="current-password" required>
                  <button type="button" class="toggle-password" id="togglePassword"
                    aria-label="Toggle password visibility">
                    <i class="fa-regular fa-eye"></i>
                  </button>
                </div>
                <div class="field-error" id="passwordError"><i class="fa-solid fa-circle-exclamation"></i><span></span>
                </div>
              </div>

              <div class="form-options">
                <label class="checkbox-label" for="rememberMe">
                  <input type="checkbox" id="rememberMe" class="custom-checkbox">
                  <span>Remember me</span>
                </label>
                <a href="#forgot" class="forgot-link" id="forgotLink">Forgot password?</a>
              </div>

              <button type="submit" class="btn-submit" id="submitBtn">
                <div class="spinner"></div>
                <span class="btn-text" id="submitBtnText">Sign In</span>
                <i class="fa-solid fa-arrow-right"></i>
              </button>
            </form>

            <div class="divider"><span>Or continue with</span></div>

            <div class="social-auth">
              <button type="button" class="btn-social" title="Continue with Google"><i
                  class="fa-brands fa-google"></i></button>
              <button type="button" class="btn-social" title="Continue with GitHub"><i
                  class="fa-brands fa-github"></i></button>
              <button type="button" class="btn-social" title="Continue with Apple"><i
                  class="fa-brands fa-apple"></i></button>
            </div>

            <p class="footer-text mb-0">
              <span id="footerPrompt">Don't have an account?</span>
              <a href="#toggle" class="footer-link" id="footerActionLink">Sign up</a>
            </p>
          </div>

          <div class="developer-area">
            <div class="social-links">
              <a href="https://skgautam7889.vercel.app/" target="_blank" rel="noopener noreferrer" title="Portfolio"><i
                  class="fa-solid fa-globe"></i></a>
              <a href="https://github.com/skgautam7889" target="_blank" rel="noopener noreferrer" title="GitHub"><i
                  class="fa-brands fa-github"></i></a>
              <a href="https://www.linkedin.com/in/suraj-kumar-865491185/" target="_blank" rel="noopener noreferrer"
                title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
              <a href="https://x.com/skgautam7889" target="_blank" rel="noopener noreferrer" title="X"><i
                  class="fa-brands fa-x-twitter"></i></a>
            </div>
            <div class="fw-semibold">Free Template</div>
            <div class="mt-1">Developed by <a href="https://skgautam7889.vercel.app/" target="_blank"
                rel="noopener noreferrer" style="color:var(--primary);font-weight:600;text-decoration:none;">Suraj
                Kumar</a></div>
            <div class="mt-1">PHP Full Stack &amp; MERN Full Stack Software Developer</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="toast" id="toastNotification">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastMsg"></span>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="assets/js/script.js"></script>
</body>

</html>
